<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Products — Apple Pay Demo</title>
<script crossorigin src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>
<style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }
    .merchant { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 20px; max-width: 600px; margin:auto; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .product { display: flex; gap: 15px; align-items:center; background:#fff; padding:12px; margin-bottom:10px; border-radius:8px; max-width:600px; margin:auto; }
    .product img { width:80px; height:80px; object-fit:cover; border-radius:8px; }
    .product-info { flex:1; }
    input[type=number] { width:50px; padding:4px; }
    .apple-pay-button {
        -webkit-appearance: -apple-pay-button;
        -apple-pay-button-type: buy;
        -apple-pay-button-style: white-outline;
        width: 220px;
        height: 44px;
        border-radius: 8px;
        margin: 20px auto 0;
        display: block;
        border: none;
        cursor: pointer;
    }
    .apple-pay-button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
    }
    #total { font-weight:bold; text-align:center; margin-top:10px; font-size:18px; }
    #status { text-align:center; margin-top:10px; font-weight:bold; }
</style>
</head>
<body>

<h1>Products — Buy with Apple Pay</h1>

<div id="merchantPanel" class="merchant"></div>

<div id="productsList"></div>

<div id="total">Total: $0.00</div>

<button id="applePayBtn" class="apple-pay-button" disabled></button>
<div id="status"></div>

<script>
// --- Load merchant info ---
const merchant = JSON.parse(localStorage.getItem("merchant")) || null;
if(!merchant){
    alert("No merchant found! Go back to create-merchant.html first.");
    window.location.href = "create-merchant.html";
}

document.getElementById("merchantPanel").innerHTML = `
    <div><strong>Store:</strong> ${merchant.storeName}</div>
    <div><strong>Owner:</strong> ${merchant.ownerName}</div>
    <div><strong>IBAN:</strong> ${merchant.iban || "N/A"}</div>
`;

// --- Sample products ---
const products = [
    { id: 1, name:"Premium Coffee Beans 500g", price:27.5, img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=60" },
    { id: 2, name:"Espresso Capsules 10-pack", price:15.0, img:"https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&q=60" },
    { id: 3, name:"Coffee Mug", price:9.99, img:"https://images.unsplash.com/photo-1556910103-1e6a5f7e0739?w=600&q=60" }
];

// --- Render products ---
const productsList = document.getElementById("productsList");
products.forEach(p=>{
    const div = document.createElement("div");
    div.className="product";
    div.innerHTML = `
        <img src="${p.img}" alt="${p.name}">
        <div class="product-info">
            <div>${p.name}</div>
            <div>Price: $${p.price.toFixed(2)}</div>
            <div>Qty: <input type="number" min="0" value="0" data-id="${p.id}"></div>
        </div>
    `;
    productsList.appendChild(div);
});

// --- Update total ---
function updateTotal(){
    const cart = [];
    let total = 0;
    document.querySelectorAll("input[type=number]").forEach(input=>{
        const qty = parseInt(input.value) || 0;
        if(qty>0){
            const prod = products.find(p=>p.id==input.dataset.id);
            cart.push({...prod, qty});
            total += prod.price * qty;
        }
    });
    localStorage.setItem("cart", JSON.stringify(cart));
document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
document.getElementById("applePayBtn").disabled = total <= 0;
}
document.querySelectorAll("input[type=number]").forEach(i=>i.addEventListener("input", updateTotal));

// --- Apple Pay (sandbox) ---
const applePayBtn = document.getElementById("applePayBtn");
const statusEl = document.getElementById("status");

function canUseApplePay(){
    if(!window.ApplePaySession) return false;
    if(typeof ApplePaySession.canMakePayments === "function" && ApplePaySession.canMakePayments()){
        return true;
    }
    return false;
}

function getPaymentRequest(cart,total){
    const lineItems = cart.map(item=>({
        label: `${item.name} x${item.qty}`,
        amount: (item.price * item.qty).toFixed(2)
    }));
    return {
        countryCode: merchant.countryCode || "US",
        currencyCode: merchant.currencyCode || "USD",
        merchantCapabilities: merchant.merchantCapabilities || ["supports3DS"],
        supportedNetworks: merchant.supportedNetworks || ["amex","discover","masterCard","visa"],
        total: {
            label: merchant.storeName || "Demo Store",
            amount: total
        },
        lineItems
    };
}

function simulateSuccess(totalValue){
    statusEl.innerText = "Payment simulated: SUCCESS — $" + totalValue;
}

async function validateWithServer(validationURL){
    const response = await fetch("/apple-pay/validate-merchant", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            validationURL,
            merchantIdentifier: merchant.merchantIdentifier
        })
    });
    if(!response.ok){
        throw new Error("Merchant validation failed");
    }
    return response.json();
}

async function onApplePayButtonClicked() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if(cart.length===0){
        alert("Select at least one product");
        return;
    }

    const totalValue = cart.reduce((sum,p)=>sum+p.price*p.qty,0).toFixed(2);
    if(!window.ApplePaySession){
        alert("Apple Pay is only available in Safari on supported devices. Simulating success instead.");
        simulateSuccess(totalValue);
        return;
    }

    const session = new ApplePaySession(3, getPaymentRequest(cart,totalValue));

    session.onvalidatemerchant = async event => {
        statusEl.innerText = "Validating merchant…";
        try{
            const merchantSession = await validateWithServer(event.validationURL);
            session.completeMerchantValidation(merchantSession);
            statusEl.innerText = "";
        }catch(err){
            console.warn("Merchant validation unavailable, falling back to demo mode.", err);
            statusEl.innerText = "Merchant validation unavailable. Showing demo success.";
            session.abort();
            simulateSuccess(totalValue);
        }
    };

    session.onpaymentauthorized = event => {
        // No real transaction — purely demo/sandbox.
        statusEl.innerText = "Authorizing sandbox payment…";
        setTimeout(()=>{
            session.completePayment(ApplePaySession.STATUS_SUCCESS);
            simulateSuccess(totalValue);
        },600);
    };

    session.oncancel = () => {
        statusEl.innerText = "Apple Pay cancelled.";
    };

    session.begin();
}

if(canUseApplePay()){
    applePayBtn.disabled = true; // stays disabled until amount > 0
    applePayBtn.addEventListener("click", onApplePayButtonClicked);
}else{
    applePayBtn.disabled = true;
    statusEl.innerText = "Apple Pay is unavailable on this browser/device.";
}

</script>
</body>
</html>
