<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buy Products — Apple Pay Demo</title>
<script crossorigin src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>

<style>
    :root {
        --bg: #f7f7f8;
        --card-bg: #ffffff;
        --radius: 16px;
        --shadow: 0 8px 20px rgba(0,0,0,0.06);
        --accent: #007aff;
        --text-dark: #111;
        --text-light: #555;
        --border: #e5e5e5;
    }

    body {
        margin: 0;
        padding: 30px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
        background: var(--bg);
        color: var(--text-dark);
    }

    h1 {
        text-align: center;
        font-weight: 700;
        font-size: 32px;
        margin-bottom: 30px;
        letter-spacing: -0.5px;
    }

    /* Merchant Panel */
    #merchantPanel {
        background: var(--card-bg);
        padding: 18px 22px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 650px;
        margin: 0 auto 30px auto;
        font-size: 15px;
        color: var(--text-light);
    }
    #merchantPanel strong {
        color: var(--text-dark);
        font-weight: 600;
    }

    /* Product Grid */
    #productsList {
        max-width: 820px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
    }

    .product {
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 15px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform 0.2s ease;
    }
    .product:hover {
        transform: translateY(-3px);
    }

    .product img {
        width: 100%;
        height: 170px;
        object-fit: cover;
        border-radius: var(--radius);
    }

    .product-name {
        font-size: 16px;
        font-weight: 600;
    }

    .product-price {
        font-size: 15px;
        color: var(--text-light);
    }

    .qty-box {
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    input[type=number] {
        width: 60px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
    }

    /* Total */
    #total {
        font-size: 22px;
        font-weight: 600;
        text-align: center;
        margin-top: 28px;
    }

    /* Apple Pay Button */
    .apple-pay-button {
        appearance: none;
        -webkit-appearance: -apple-pay-button;
        -apple-pay-button-type: buy;
        -apple-pay-button-style: black;
        width: 280px;
        height: 48px;
        border-radius: 12px;
        display: block;
        margin: 22px auto 0 auto;
        cursor: pointer;
        transition: opacity 0.25s ease;
    }
    .apple-pay-button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
    }

    /* Status */
    #status {
        text-align: center;
        margin-top: 12px;
        font-size: 15px;
        color: var(--text-light);
    }

    /* Success Overlay */
    #successOverlay {
         position: fixed; 
         top: 0; 
         left: 0;
         width: 100%; 
         height: 100%; 
         background: rgba(0,0,0,0.45); 
         display: flex; 
         align-items: center; 
         justify-content: center; 
         opacity: 0; 
         pointer-events: none; 
         transition: opacity 0.3s ease; 
    } 
    
    #successOverlay.visible { 
        opacity: 1;  
        pointer-events: auto; 
    } 
    
    #successOverlay .card { 
        background: #fff; 
        border-radius: 16px; 
        padding: 30px; 
        box-shadow: 0 12px 30px rgba(0,0,0,0.2); 
        text-align: center; 
        width: 320px; 
        animation: slideUp 0.35s ease; 
    } 
    #successOverlay .card .amount { 
        font-size: 28px; 
        font-weight: bold; 
        margin: 10px 0 20px; 
    } 
    @keyframes slideUp { 
        from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } 
    }
</style>

</head>
<body>

<h1>Buy with Apple Pay</h1>

<div id="merchantPanel"></div>

<div id="productsList"></div>

<div id="total">Total: $0.00</div>

<button id="applePayBtn" class="apple-pay-button" disabled></button>
<div id="status"></div>

<!-- Success Popup -->
<div id="successOverlay">
    <div class="card">
        <div style="font-size:18px;font-weight:600;margin-bottom:10px;">Payment Successful</div>
        <div class="amount">$0.00</div>
    </div>
</div>

<script>
/*  EVERYTHING BELOW IS YOUR SAME JS — Only UI changed   */

const merchant = JSON.parse(localStorage.getItem("merchant")) || null;
if(!merchant){
    alert("No merchant found! Go back to create-merchant.html first.");
    window.location.href = "create-merchant.html";
}

document.getElementById("merchantPanel").innerHTML = `
    <div><strong>Store:</strong> ${merchant.storeName}</div>
    <div><strong>Owner:</strong> ${merchant.ownerName}</div>
    <div><strong>IBAN:</strong> ${merchant.iban || "N/A"}</div>
`;

const products = [
    { id: 1, name:"Premium Coffee Beans 500g", price:27.5, img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&q=60" },
    { id: 2, name:"Espresso Capsules 10-pack", price:15.0, img:"https://images.unsplash.com/photo-1551024601-bec78aea704b?w=600&q=60" },
    { id: 3, name:"Coffee Mug", price:9.99, img:"img/coffee-mug.webp" }
];

const productsList = document.getElementById("productsList");
products.forEach(p=>{
    const div = document.createElement("div");
    div.className="product";
    div.innerHTML = `
        <img src="${p.img}">
        <div class="product-name">${p.name}</div>
        <div class="product-price">$${p.price.toFixed(2)}</div>
        <div class="qty-box">
            <span>Qty:</span>
            <input type="number" min="0" value="0" data-id="${p.id}">
        </div>
    `;
    productsList.appendChild(div);
});

function updateTotal(){
    const cart = [];
    let total = 0;
    document.querySelectorAll("input[type=number]").forEach(input=>{
        const qty = parseInt(input.value) || 0;
        if(qty > 0){
            const prod = products.find(p=>p.id==input.dataset.id);
            cart.push({...prod, qty});
            total += prod.price * qty;
        }
    });
    localStorage.setItem("cart", JSON.stringify(cart));
    document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
    document.getElementById("applePayBtn").disabled = total <= 0;
}
document.querySelectorAll("input[type=number]").forEach(i=>i.addEventListener("input", updateTotal));

const applePayBtn = document.getElementById("applePayBtn");
const statusEl = document.getElementById("status");
const successOverlay = document.getElementById("successOverlay");
const amountEl = successOverlay.querySelector(".amount");

function canUseApplePay(){
    return window.ApplePaySession && ApplePaySession.canMakePayments();
}

function simulateSuccess(amount){
    statusEl.innerText = "Payment simulated: SUCCESS — $" + amount;
    amountEl.innerText = "$" + amount;
    successOverlay.classList.add("visible");
    setTimeout(()=> successOverlay.classList.remove("visible"), 3500);
}

function getPaymentRequest(cart,total){
    const lineItems = cart.map(item=>({
        label: `${item.name} x${item.qty}`,
        amount: (item.price * item.qty).toFixed(2)
    }));
    return {
        countryCode: merchant.countryCode || "US",
        currencyCode: merchant.currencyCode || "USD",
        merchantCapabilities: merchant.merchantCapabilities || ["supports3DS"],
        supportedNetworks: merchant.supportedNetworks || ["visa","masterCard","amex","discover"],
        lineItems,
        total: { label: merchant.storeName || "Demo Store", amount: total }
    };
}

async function validateWithServer(validationURL){
    const res = await fetch("/apple-pay/validate-merchant", {
        method: "POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ validationURL, merchantIdentifier: merchant.merchantIdentifier })
    });
    if(!res.ok) throw new Error("Validation failed");
    return res.json();
}

async function onApplePayButtonClicked(){
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if(cart.length===0) return alert("Select a product");

    const totalValue = cart.reduce((s,p)=>s+p.price*p.qty,0).toFixed(2);

    if(!window.ApplePaySession){
        simulateSuccess(totalValue);
        return;
    }

    const session = new ApplePaySession(3, getPaymentRequest(cart,totalValue));

    session.onvalidatemerchant = async e => {
        try{
            statusEl.innerText = "Validating merchant…";
            const merchantSession = await validateWithServer(e.validationURL);
            session.completeMerchantValidation(merchantSession);
            statusEl.innerText = "";
        }catch{
            statusEl.innerText = "Merchant validation unavailable. Simulating.";
            session.abort();
            simulateSuccess(totalValue);
        }
    };

    session.onpaymentauthorized = () => {
        statusEl.innerText = "Authorizing sandbox payment…";
        setTimeout(()=>{
            session.completePayment(ApplePaySession.STATUS_SUCCESS);
            simulateSuccess(totalValue);
        }, 1200);
    };

    session.oncancel = () => statusEl.innerText = "Apple Pay cancelled.";

    session.begin();
}

if(canUseApplePay()){
    applePayBtn.addEventListener("click", onApplePayButtonClicked);
}else{
    applePayBtn.disabled = true;
    statusEl.innerText = "Apple Pay not available on this device.";
}
</script>

</body>
</html>
